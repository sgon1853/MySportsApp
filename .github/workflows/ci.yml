name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run backend tests (unit + Testcontainers integration)
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Write CI .env
        run: |
          cat > .env <<EOF
          POSTGRES_DB=mysportsapp
          POSTGRES_USER=mysportsapp
          POSTGRES_PASSWORD=ci-password
          SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/mysportsapp
          SPRING_DATASOURCE_USERNAME=mysportsapp
          SPRING_DATASOURCE_PASSWORD=ci-password
          JWT_SECRET=ci-only-secret-not-for-production-use-0123456789
          JWT_EXPIRATION_DAYS=7
          ADMIN_BOOTSTRAP_EMAIL=admin@example.com
          ADMIN_BOOTSTRAP_PASSWORD=ci-admin-password
          FRONTEND_PORT=8081
          EOF
      - name: Build and start the stack
        run: docker compose -f deploy/docker-compose.yml --env-file .env up --build -d
      - name: Wait for backend health
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8080/actuator/health && exit 0
            sleep 5
          done
          echo "backend did not become healthy in time" >&2
          docker compose -f deploy/docker-compose.yml --env-file .env logs
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run e2e tests against the compose stack
        working-directory: frontend
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8081
          E2E_USER_EMAIL: admin@example.com
          E2E_USER_PASSWORD: ci-admin-password
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml --env-file .env logs
      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml --env-file .env down -v

  # Deploys only run for actual pushes to master (i.e. after a PR merges
  # past branch protection's required checks above), never for PR runs.
  # Both jobs deploy the new revision with --no-traffic, smoke-test it on
  # its own per-revision URL, and only then shift production traffic to
  # it. A failed smoke test simply never gets promoted - production keeps
  # serving the last-good revision untouched, so there is nothing to roll
  # back. Both jobs also no-op (rather than fail) until GCP_PROJECT_ID is
  # configured, so pushing before the one-time cloud setup doesn't show a
  # false failure. See docs/deployment.md for that setup. Exception: the
  # very first deploy of each service can't use --no-traffic at all (gcloud
  # rejects it when a service doesn't exist yet), so that one deploy goes
  # live immediately with no canary window - unavoidable for a brand-new
  # Cloud Run service, and only affects the one-time bootstrap.
  deploy-backend:
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push' && vars.GCP_PROJECT_ID != ''
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      backend_url: ${{ steps.describe.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - name: Build and push image
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/mysportsapp/backend:${{ github.sha }}"
          docker build -t "$IMAGE" backend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy candidate revision (no traffic yet)
        run: |
          # --no-traffic is rejected by gcloud when creating a brand-new
          # service (there's no existing revision for "no traffic" to be
          # relative to) - only meaningful from the second deploy onward.
          NO_TRAFFIC_FLAG="--no-traffic"
          if ! gcloud run services describe mysportsapp-backend --region "${{ vars.GCP_REGION }}" >/dev/null 2>&1; then
            echo "First-ever deploy of mysportsapp-backend - skipping --no-traffic (nothing to canary against yet)."
            NO_TRAFFIC_FLAG=""
          fi
          gcloud run deploy mysportsapp-backend \
            --image "$IMAGE" \
            --region "${{ vars.GCP_REGION }}" \
            --allow-unauthenticated \
            $NO_TRAFFIC_FLAG --tag candidate \
            --set-env-vars "SPRING_PROFILES_ACTIVE=docker,SPRING_DATASOURCE_URL=${{ vars.NEON_DATASOURCE_URL }},SPRING_DATASOURCE_USERNAME=${{ vars.NEON_DATASOURCE_USERNAME }},ADMIN_BOOTSTRAP_EMAIL=${{ vars.ADMIN_BOOTSTRAP_EMAIL }},JWT_EXPIRATION_DAYS=7,APP_CORS_ALLOWED_ORIGIN_PATTERNS=${{ vars.APP_CORS_ALLOWED_ORIGIN_PATTERNS || 'http://localhost:*' }}" \
            --set-secrets "JWT_SECRET=jwt-secret:latest,ADMIN_BOOTSTRAP_PASSWORD=admin-bootstrap-password:latest,SPRING_DATASOURCE_PASSWORD=db-password:latest" \
            --quiet
      - name: Smoke-test the candidate revision (proves app + DB + migrations are healthy)
        run: |
          CANDIDATE_URL=$(gcloud run services describe mysportsapp-backend --region "${{ vars.GCP_REGION }}" --format=json \
            | jq -r '.status.traffic[] | select(.tag=="candidate") | .url')
          echo "Candidate URL: $CANDIDATE_URL"
          for _ in $(seq 1 10); do
            if curl -sf "$CANDIDATE_URL/actuator/health"; then
              echo "healthy"
              exit 0
            fi
            sleep 6
          done
          echo "::error::Candidate backend revision never became healthy - not promoting. Production traffic is untouched." >&2
          exit 1
      - name: Promote candidate to serve production traffic
        id: describe
        run: |
          gcloud run services update-traffic mysportsapp-backend --region "${{ vars.GCP_REGION }}" --to-latest --quiet
          URL=$(gcloud run services describe mysportsapp-backend --region "${{ vars.GCP_REGION }}" --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push' && vars.GCP_PROJECT_ID != ''
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - name: Build and push image (backend URL baked in at build time)
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/mysportsapp/frontend:${{ github.sha }}"
          docker build \
            --build-arg VITE_API_BASE_URL="${{ needs.deploy-backend.outputs.backend_url }}/api" \
            -t "$IMAGE" frontend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy candidate revision (no traffic yet)
        run: |
          NO_TRAFFIC_FLAG="--no-traffic"
          if ! gcloud run services describe mysportsapp-frontend --region "${{ vars.GCP_REGION }}" >/dev/null 2>&1; then
            echo "First-ever deploy of mysportsapp-frontend - skipping --no-traffic (nothing to canary against yet)."
            NO_TRAFFIC_FLAG=""
          fi
          # BACKEND_UPSTREAM=127.0.0.1:1 is deliberately unreachable - the
          # frontend calls the backend directly via its own Cloud Run URL
          # (baked in above), so nginx's "/api/" proxy_pass is dead code
          # here. It still needs to be *something* nginx can resolve at
          # startup without a real DNS lookup (an IP literal always is),
          # or nginx refuses to start at all - see nginx.conf.template.
          gcloud run deploy mysportsapp-frontend \
            --image "$IMAGE" \
            --region "${{ vars.GCP_REGION }}" \
            --allow-unauthenticated \
            $NO_TRAFFIC_FLAG --tag candidate \
            --set-env-vars "BACKEND_UPSTREAM=127.0.0.1:1" \
            --quiet
      - name: Smoke-test the candidate revision
        run: |
          CANDIDATE_URL=$(gcloud run services describe mysportsapp-frontend --region "${{ vars.GCP_REGION }}" --format=json \
            | jq -r '.status.traffic[] | select(.tag=="candidate") | .url')
          echo "Candidate URL: $CANDIDATE_URL"
          for _ in $(seq 1 10); do
            if curl -sf -o /dev/null "$CANDIDATE_URL/"; then
              echo "healthy"
              exit 0
            fi
            sleep 6
          done
          echo "::error::Candidate frontend revision never became healthy - not promoting. Production traffic is untouched." >&2
          exit 1
      - name: Promote candidate to serve production traffic
        run: |
          gcloud run services update-traffic mysportsapp-frontend --region "${{ vars.GCP_REGION }}" --to-latest --quiet
          URL=$(gcloud run services describe mysportsapp-frontend --region "${{ vars.GCP_REGION }}" --format='value(status.url)')
          echo "Live at: $URL"
