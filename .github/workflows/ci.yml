name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run backend tests (unit + Testcontainers integration)
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Write CI .env
        run: |
          cat > .env <<EOF
          POSTGRES_DB=mysportsapp
          POSTGRES_USER=mysportsapp
          POSTGRES_PASSWORD=ci-password
          SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/mysportsapp
          SPRING_DATASOURCE_USERNAME=mysportsapp
          SPRING_DATASOURCE_PASSWORD=ci-password
          JWT_SECRET=ci-only-secret-not-for-production-use-0123456789
          JWT_EXPIRATION_DAYS=7
          ADMIN_BOOTSTRAP_EMAIL=admin@example.com
          ADMIN_BOOTSTRAP_PASSWORD=ci-admin-password
          FRONTEND_PORT=8081
          EOF
      - name: Build and start the stack
        run: docker compose -f deploy/docker-compose.yml --env-file .env up --build -d
      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/actuator/health && exit 0
            sleep 5
          done
          echo "backend did not become healthy in time" >&2
          docker compose -f deploy/docker-compose.yml --env-file .env logs
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run e2e tests against the compose stack
        working-directory: frontend
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8081
          E2E_USER_EMAIL: admin@example.com
          E2E_USER_PASSWORD: ci-admin-password
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml --env-file .env logs
      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml --env-file .env down -v
