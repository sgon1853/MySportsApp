spring:
  application:
    name: backend
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  # Cloud Run injects PORT and requires the container to listen on it;
  # everywhere else (local, docker-compose) it's unset and falls back to 8080.
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    # Comma-separated origin patterns ("*" wildcards allowed) permitted to
    # call the API. The default covers every localhost port used across
    # `npm run dev` (5173), docker-compose/CI (published on FRONTEND_PORT,
    # default 8081), and any other local port - see SecurityConfig for why
    # this is needed even for nominally "same-origin" nginx-proxied calls.
    # A real deployment (e.g. a Cloud Run frontend) should override this to
    # its actual origin, e.g. "https://mysportsapp-frontend-*.a.run.app".
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}
