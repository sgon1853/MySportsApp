spring:
  application:
    name: backend
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  # Cloud Run injects PORT and requires the container to listen on it;
  # everywhere else (local, docker-compose) it's unset and falls back to 8080.
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    # Comma-separated origin patterns ("*" wildcards allowed) permitted to
    # call the API. The default covers every localhost port used across
    # `npm run dev` (5173), docker-compose/CI (published on FRONTEND_PORT,
    # default 8081), and any other local port - see SecurityConfig for why
    # this is needed even for nominally "same-origin" nginx-proxied calls.
    # A real deployment (e.g. a Cloud Run frontend) should override this to
    # its actual origin, e.g. "https://mysportsapp-frontend-*.a.run.app".
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}
  strava:
    # AES-256 key (base64, 32 raw bytes) used to encrypt Strava OAuth tokens
    # at rest - see EncryptedStringConverter. The default below is a fixed,
    # publicly-known dev key: fine for local/CI where nothing sensitive is
    # ever actually stored, never use it for a real deployment (Cloud Run
    # gets its own, generated the same way as the other Secret Manager
    # values - see docs/deployment.md).
    token-encryption-key: ${STRAVA_TOKEN_ENCRYPTION_KEY:ykExKKyIMrzGl0iwCNNEBLCtBOasQnhVws4ybQ9pmls=}
    # Unset by default - connecting/syncing Strava simply isn't usable until
    # these are configured with a real Strava API app's credentials. The app
    # still boots fine without them; StravaOAuthService fails clearly if used.
    client-id: ${STRAVA_CLIENT_ID:}
    client-secret: ${STRAVA_CLIENT_SECRET:}
    # Where Strava redirects the browser after the user approves/denies
    # access - must be registered exactly in the Strava API app's settings.
    redirect-uri: ${STRAVA_REDIRECT_URI:http://localhost:8081/api/v1/integrations/strava/callback}
    # Where this backend then redirects the browser once OAuth is done - the
    # frontend's own origin (same-origin docker-compose/nginx locally; the
    # separately-deployed frontend's URL in production, same as
    # APP_CORS_ALLOWED_ORIGIN_PATTERNS points at).
    frontend-url: ${STRAVA_FRONTEND_URL:http://localhost:8081}
